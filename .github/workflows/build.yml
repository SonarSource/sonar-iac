name: Build
on:
  push:
    branches:
      - master
      - branch-*
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.1"
  GOLANG_CI_LINT_VERSION: "2.4.0"
  SONAR_PROJECT_KEY: "SonarSource_sonar-iac"

jobs:
  build:
    runs-on: sonar-s-public
    name: Build and Analysis
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2025.7.12

      - name: Install golangci-lint
        run: |
          curl --proto "=https" -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /home/runner/go/bin v${GOLANG_CI_LINT_VERSION}
          echo "/opt/go/bin:/opt/protoc/bin:/opt/musl/bin:/home/runner/go/bin" >> $GITHUB_PATH

      - name: Checkout build logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticate the clone so it is not subject to GitHub's anonymous rate limits.
          git \
            -c credential.helper= \
            -c 'credential.https://github.com.helper=!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$GH_TOKEN"; fi; }; f' \
            -c http.https://github.com/.proactiveAuth=auto \
            submodule update --init --depth 1 -- build-logic/common

      - name: Create Gradle User Home
        shell: bash
        run: |
          export GRADLE_USER_HOME=${GITHUB_WORKSPACE}/.gradle
          mkdir -p ${GRADLE_USER_HOME}
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME}" >> $GITHUB_ENV

      - name: Create Go cache keys
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          export GOCACHE=$(go env GOCACHE)
          echo "GOCACHE=${GOCACHE}" >> $GITHUB_ENV
          # NOTE: Find Go source files in sonar-helm-for-iac
          export GOCACHE_KEY=$(find ${GITHUB_WORKSPACE}/sonar-helm-for-iac -name '*.go' -o -name 'go.mod' -o -name 'go.sum' 2>/dev/null | \
            xargs cat 2>/dev/null | sha256sum | xargs echo $RUNNER_OS $RUNNER_ARCH | tr -s ' ' '-')
          echo "GOCACHE_KEY=${GOCACHE_KEY}" >> $GITHUB_ENV

      - name: Build and analyze
        uses: SonarSource/ci-github-actions/build-gradle@v2
        env:
          GO_CROSS_COMPILE: "1"
        with:
          deploy-pull-request: false
          skip-tests: false
          use-develocity: true
          gradle-args: --build-cache -x artifactoryPublish -Dsonar.projectName=SonarIaC
          disable-caching: true
          run-shadow-scans: ${{ github.event_name == 'schedule' }}

  notify_slack:
    name: Notify Slack on Failure
    needs: [ build ]
    if: >-
      !cancelled() && failure() &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/'))
    permissions:
      id-token: write
      statuses: read
    runs-on: github-ubuntu-latest-s
    steps:
      - uses: SonarSource/release-github-actions/notify-slack@v1
        with:
          project-name: "SonarIaC - Public"
          slack-channel: "squad-security-cloud-notifs"
          icon: ':face_in_clouds:'
          jobs: ${{ toJSON(needs) }}
